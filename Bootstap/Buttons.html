<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="buttons.css" />
  </head>
  <body>
    <h2 style="text-align: center">Buttons</h1>
    <br />
    <div style="text-align: center">
      <div class="btn btn-success">Button 1</div>
      <div class="btn btn-primary">Button 2</div>
      <div class="btn btn-danger">Button 3</div>
      <div class="btn btn-warning">Button 4</div>
    </div>
    <br />
<h2 style="text-align: center">Outline Buttons</h2>
    <br />
    <div style="text-align: center">
      <div class="btn btn-outline-success">Button 1</div>
      <div class="btn btn-outline-primary">Button 2</div>
      <div class="btn btn-outline-danger">Button 3</div>
      <div class="btn btn-outline-warning">Button 4</div>
<br />
      <h2 style = "text-align: center">diffferent button sizes</h2>
      <br />
      <div style="text-align: center">
        
      <div class="btn btn-primary btn-lg">Large Button</div>
        <div class="btn btn-primary btn-md">Medium Button</div>
        <div class="btn btn-primary btn-sm">Small Button</div>
        <div class="btn btn-primary btn-xs">Extra Small Button</div>
        </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </body>
</html>
