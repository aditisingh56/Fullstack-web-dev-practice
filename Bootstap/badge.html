<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Badges</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 2rem;
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .section-title {
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">Bootstrap Badge Showcase</h1>

      <section>
        <h2 class="section-title">Simple Badges</h2>
        <span class="badge bg-danger">New Message</span>
        <span class="badge bg-primary">10+ Messages</span>
      </section>

      <section>
        <h2 class="section-title">Badge Inside Button</h2>
        <button type="button" class="btn btn-primary position-relative">
          Notifications
          <span
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            9+
            <span class="visually-hidden">unread messages</span>
          </span>
        </button>
      </section>

      <section>
        <h2 class="section-title">Contextual Variations</h2>
        <span class="badge rounded-pill bg-success">Success</span>
        <span class="badge rounded-pill bg-info text-dark">Info</span>
        <span class="badge rounded-pill bg-warning text-dark">Warning</span>
        <span class="badge rounded-pill bg-secondary">Secondary</span>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
